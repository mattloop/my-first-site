<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة التحكم | عمار المهدي</title>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link id="all-fonts" rel="stylesheet">
  <style>
    /* ============================================================
       لوحة التحكم: كحلي "ورق المهندس" + أبيض بارد
       المرجاني محجوز لزرار النشر بس
       ============================================================ */
    :root {
      --ink: #12304a; --ink-2: #1d4566; --paper: #f4f6f8; --white: #ffffff; --line: #d9e0e6;
      --muted: #5f6b76; --teal: #2a6f68; --teal-soft: #e3f1ef; --coral: #c2461f; --danger: #b42318;
      --side: 340px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Readex Pro', system-ui, sans-serif; color: var(--ink); background: var(--paper); font-size: 16px; line-height: 1.6; }
    button, input, select, textarea { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px;
      border-radius: 10px; border: 1.5px solid var(--line); background: var(--white); cursor: pointer; font-weight: 600; white-space: nowrap; }
    .btn:hover { border-color: var(--ink); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--white); }
    .btn.publish { background: var(--coral); border-color: var(--coral); color: var(--white); }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { border-color: var(--danger); }
    .btn.small { min-height: 38px; padding: 6px 12px; font-size: .9rem; }
    .btn.block { width: 100%; }

    /* ================= الدخول ================= */
    #login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; background-color: var(--ink);
      background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 96px 96px, 96px 96px, 16px 16px, 16px 16px; }
    .login-card { width: 100%; max-width: 400px; background: var(--white); border-radius: 18px; padding: 32px 28px; box-shadow: 0 30px 60px rgba(0,0,0,.25); }
    .login-card h1 { font-size: 1.6rem; line-height: 1.4; }
    .login-card p.lead { color: var(--muted); margin: 4px 0 24px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .field { margin-bottom: 14px; }
    .field input, .field textarea, .field select { width: 100%; min-height: 44px; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); }
    .field textarea { min-height: 84px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px rgba(18,48,74,.15); }
    .hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
    .error { color: var(--danger); font-size: .92rem; margin-top: 4px; min-height: 1.4em; }
    .login-card .btn { width: 100%; margin-top: 4px; }

    /* ================= قايمة الصفحات ================= */
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: var(--white); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: 1.1rem; }
    .brand small { display: block; color: var(--muted); font-weight: 400; font-size: .85rem; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
    .tabs button { border: none; background: none; padding: 10px 14px; min-height: 44px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
    .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 18px; }
    .page-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--white);
      border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
    .page-row h3 { font-size: 1.05rem; }
    .meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .88rem; margin-top: 2px; align-items: center; }
    .meta code { direction: ltr; unicode-bidi: isolate; background: var(--paper); padding: 0 6px; border-radius: 6px; }
    .badge { display: inline-block; padding: 0 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
    .badge.draft { background: #eef1f4; color: var(--muted); }
    .badge.published { background: var(--teal-soft); color: var(--teal); }
    .badge.old { background: #fff1e6; color: #8a4b12; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .empty { text-align: center; background: var(--white); border: 2px dashed var(--line); border-radius: 16px; padding: 36px 20px; }
    .empty p { color: var(--muted); margin: 6px 0 16px; }

    /* ================= المحرر ================= */
    #editor { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    .ed-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--ink); color: var(--white); flex-wrap: wrap; }
    .ed-bar .btn { min-height: 40px; padding: 6px 12px; background: var(--ink-2); border-color: transparent; color: var(--white); font-size: .9rem; }
    .ed-bar .btn:hover { border-color: rgba(255,255,255,.5); }
    .ed-bar .btn.on { background: var(--white); color: var(--ink); }
    .ed-bar .btn.publish { background: var(--coral); }
    .ed-title { font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ed-status { font-size: .85rem; opacity: .85; }
    .grow { flex: 1; }
    .ed-main { display: grid; grid-template-columns: var(--side) 1fr; min-height: 0; }
    .side { background: var(--white); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .side .tabs { margin: 0; padding: 0 8px; flex: none; }
    .side-body { overflow-y: auto; padding: 14px; flex: 1; }
    .side h4 { font-size: .95rem; margin: 14px 0 8px; color: var(--ink); }
    .side h4:first-child { margin-top: 0; }
    .lib { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .lib button { text-align: start; border: 1.5px solid var(--line); background: var(--white); border-radius: 12px; padding: 10px; cursor: pointer; min-height: 52px; }
    .lib button:hover { border-color: var(--teal); background: var(--teal-soft); }
    .lib b { display: block; font-size: .92rem; }
    .lib small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .lib.one { grid-template-columns: 1fr; }
    .ctl { margin-bottom: 14px; }
    .ctl > span { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chips button { border: 1.5px solid var(--line); background: var(--white); border-radius: 8px; padding: 4px 10px; min-height: 36px; min-width: 36px; cursor: pointer; font-size: .85rem; }
    .chips button.on { border-color: var(--ink); background: var(--ink); color: var(--white); }
    .chips button.swatch { width: 36px; height: 36px; border-radius: 50%; padding: 0; border: 2px solid var(--line); }
    .chips button.swatch.on { outline: 3px solid var(--ink); outline-offset: 2px; background-clip: padding-box; }
    .chips button.swatch.none { background: repeating-linear-gradient(45deg, #fff 0 6px, #f1d4cc 6px 8px); }
    .sel-info { background: var(--paper); border-radius: 10px; padding: 8px 10px; font-size: .85rem; margin-bottom: 12px; }
    .stage { background: #dfe5ea; overflow: hidden; display: flex; justify-content: center; padding: 64px 16px 16px; min-height: 0; position: relative; }
    #float-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 20px);
      background: var(--ink); color: #fff; border-radius: 14px; padding: 5px 6px; box-shadow: 0 12px 30px rgba(18,48,74,.35); }
    #fb-grip { cursor: grab; padding: 6px 4px; color: #9fb4c6; font-size: 18px; line-height: 1; user-select: none; touch-action: none; flex: none; }
    #fb-grip:active { cursor: grabbing; }
    #fb-body { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: thin; white-space: nowrap; }
    #fb-body button { display: inline-flex; align-items: center; gap: 5px; border: none; background: var(--ink-2); color: #fff; border-radius: 9px; padding: 7px 10px; min-height: 36px; cursor: pointer; font-size: .85rem; white-space: nowrap; flex: none; }
    #fb-body button:hover { background: var(--teal); }
    #fb-body button.fb-danger { background: #8a2414; }
    #fb-body button[data-s] span, #fb-body button.ic-only span { display: none; }
    #fb-body button[data-s] { padding: 7px 8px; }
    #fb-body button.fb-ok { background: var(--teal); }
    .fb-lbl { font-size: .8rem; color: #cfe3e0; padding: 0 6px; white-space: nowrap; flex: none; }
    .fb-sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.2); margin: 2px 4px; flex: none; }
    #canvas { background: #fff; border: 0; width: 100%; height: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.12); border-radius: 6px; }
    .stage.mobile #canvas { width: 390px; }
    .side-toggle { display: none !important; }
    @media (max-width: 860px) {
      .ed-main { grid-template-columns: 1fr; }
      .side { position: fixed; inset-inline: 0; bottom: 0; height: 58vh; z-index: 50; border-radius: 18px 18px 0 0; box-shadow: 0 -12px 30px rgba(0,0,0,.2); transform: translateY(100%); transition: transform .2s; }
      body.side-open .side { transform: none; }
      .side-toggle { display: inline-flex !important; }
      .stage { padding: 56px 0 0; }
      #float-bar { top: 6px; }
      #canvas { border-radius: 0; }
    }

    /* ================= نافذة الحوار + الإشعار ================= */
    dialog { border: none; border-radius: 16px; padding: 0; width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); box-shadow: 0 30px 60px rgba(0,0,0,.3); }
    dialog::backdrop { background: rgba(18,48,74,.55); }
    .dlg-body { padding: 22px; }
    .dlg-body h3 { font-size: 1.2rem; margin-bottom: 12px; }
    .dlg-body h4 { font-size: .95rem; margin: 12px 0 6px; }
    .dlg-body p { color: var(--muted); margin-bottom: 12px; }
    .dlg-actions { display: flex; gap: 8px; justify-content: flex-start; padding: 0 22px 22px; flex-wrap: wrap; }
    .choice { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-weight: 400; }
    .choice input { margin-top: 6px; width: 18px; height: 18px; flex: none; }
    .choice b { display: block; }
    .choice small { display: block; color: var(--muted); }
    .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; margin: 6px 0 12px; }
    .img-grid button { border: 2px solid var(--line); border-radius: 10px; padding: 0; cursor: pointer; overflow: hidden; aspect-ratio: 1; background: var(--paper); }
    .img-grid button:hover { border-color: var(--teal); }
    .img-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; display: block; font-weight: 600; }
    .drop:hover { border-color: var(--teal); background: var(--teal-soft); }
    .drop input { display: none; }
    #toast { position: fixed; bottom: 20px; inset-inline-start: 20px; z-index: 9999; background: var(--ink); color: var(--white);
      padding: 12px 18px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.25); max-width: min(440px, calc(100% - 40px));
      opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
    #toast.show { opacity: 1; transform: none; }
    #toast.bad { background: var(--danger); }
    #toast.good { background: var(--teal); }
    @media (prefers-reduced-motion: reduce) { #toast, .side { transition: none; } }
    @media (max-width: 600px) { .page-row { grid-template-columns: 1fr; } .row-actions { justify-content: flex-start; } }
  </style>
</head>
<body>

<!-- ======================= 1) الدخول ======================= -->
<main id="login">
  <form class="login-card" id="login-form" novalidate>
    <h1>لوحة تحكم موقعك</h1>
    <p class="lead">سجّل دخولك عشان تعدّل صفحات الموقع.</p>
    <div class="field"><label for="email">الإيميل</label><input id="email" type="email" autocomplete="username" dir="ltr" required></div>
    <div class="field"><label for="password">الباسورد</label><input id="password" type="password" autocomplete="current-password" dir="ltr" required></div>
    <p class="error" id="login-error" role="alert"></p>
    <button class="btn primary" type="submit" id="login-btn">دخول</button>
  </form>
</main>

<!-- ======================= 2) الصفحات والمحتوى ======================= -->
<div id="pages" hidden>
  <header class="bar">
    <div class="brand">لوحة التحكم<small id="who"></small></div>
    <button class="btn small" type="button" id="logout-btn">خروج</button>
  </header>
  <main class="wrap">
    <nav class="tabs" id="kind-tabs" aria-label="نوع المحتوى">
      <button type="button" data-kind="page" class="on">الصفحات</button>
      <button type="button" data-kind="post">المدونة</button>
      <button type="button" data-kind="product">المنتجات</button>
      <button type="button" data-kind="service">الخدمات</button>
    </nav>
    <div class="actions" id="list-actions"></div>
    <div id="page-list" aria-live="polite"></div>
  </main>
</div>

<!-- ======================= 3) المحرر ======================= -->
<div id="editor" hidden>
  <div class="ed-bar">
    <button class="btn" type="button" id="back-btn">→ رجوع</button>
    <span class="ed-title" id="ed-title"></span>
    <span class="ed-status" id="ed-status" aria-live="polite"></span>
    <span class="grow"></span>
    <button class="btn side-toggle" type="button" id="side-toggle">الأدوات</button>
    <button class="btn on" type="button" data-device="desktop">كمبيوتر</button>
    <button class="btn" type="button" data-device="mobile">موبايل</button>
    <button class="btn" type="button" id="undo-btn" title="تراجع (Ctrl+Z)">تراجع</button>
    <button class="btn" type="button" id="redo-btn" title="إعادة (Ctrl+Y)">إعادة</button>
    <button class="btn" type="button" id="preview-btn">معاينة</button>
    <button class="btn" type="button" id="save-btn">حفظ</button>
    <button class="btn publish" type="button" id="publish-btn">نشر</button>
  </div>
  <div class="ed-main">
    <aside class="side" aria-label="أدوات التعديل">
      <nav class="tabs" id="side-tabs">
        <button type="button" data-tab="add" class="on">إضافة</button>
        <button type="button" data-tab="style">تنسيق</button>
        <button type="button" data-tab="page">الصفحة</button>
      </nav>
      <div class="side-body" id="side-add"></div>
      <div class="side-body" id="side-style" hidden></div>
      <div class="side-body" id="side-page" hidden></div>
    </aside>
    <div class="stage" id="stage">
      <div id="float-bar" role="toolbar" aria-label="أدوات العنصر المختار"><span id="fb-grip" title="اسحبني لأي مكان (دبل كليك يرجّعني مكاني)" aria-hidden="true">⠿</span><div id="fb-body"></div></div>
      <iframe id="canvas" title="الصفحة اللي بتعدّلها"></iframe>
    </div>
  </div>
</div>

<dialog id="dlg"><form method="dialog"><div class="dlg-body" id="dlg-body"></div><div class="dlg-actions" id="dlg-actions"></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   الإعدادات: عنوان المشروع + المفتاح العام (آمن يتحط هنا — البوّاب RLS
   هو اللي بيحمي البيانات، والمفتاح ده مجرد "كارت زائر")
   ===================================================================== */

const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVycmJndm9hc2hkd2hwa252a3dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MDkzNTEsImV4cCI6MjExMDA4NTM1MX0.OC6ZDoG50yDTcu1uwnEF_1n8nWf2n7T3MolMY5vwnjg';
const BUCKET = 'site-images';
const TEMPLATE_FILE = 'binjan-style.html';
const SESSION_KEY = 'ammar-admin-session';
const MAX_IMAGE_MB = 5;
const WA = 'https://wa.me/201000649748';
const GLOBAL_SLUG = 'site-global';
const KIND_NAMES = { page: 'صفحة', post: 'مقال', product: 'منتج', service: 'خدمة' };
const KIND_NEW = { page: '+ صفحة جديدة', post: '+ مقال جديد', product: '+ منتج جديد', service: '+ خدمة جديدة' };
const KIND_PLURAL = { post: 'المدونة', product: 'المنتجات', service: 'الخدمات' };
const LIST_SLUG = { post: 'blog', product: 'products', service: 'services' };

/* الخطوط العربية المتاحة في لوحة التنسيق */
const FONTS = [
  ['Readex Pro', 'ريدكس (الأساسي)', 'Readex+Pro:wght@300;400;500;600;700'],
  ['Aref Ruqaa', 'رقعة', 'Aref+Ruqaa:wght@400;700'],
  ['Cairo', 'القاهرة', 'Cairo:wght@400;600;700;800'],
  ['Tajawal', 'تجوال', 'Tajawal:wght@400;500;700;800'],
  ['Almarai', 'المراعي', 'Almarai:wght@400;700;800'],
  ['El Messiri', 'المسيري', 'El+Messiri:wght@400;600;700'],
  ['Reem Kufi', 'ريم كوفي', 'Reem+Kufi:wght@400;600;700'],
  ['Changa', 'تشانجا', 'Changa:wght@400;600;700'],
  ['Amiri', 'أميري', 'Amiri:wght@400;700'],
  ['Marhey', 'مرحي', 'Marhey:wght@400;600;700'],
  ['Lalezar', 'لاله زار', 'Lalezar'],
];
const fontsHref = (list) => 'https://fonts.googleapis.com/css2?' + list.map((f) => 'family=' + f[2]).join('&') + '&display=swap';
const ALL_FONTS_HREF = fontsHref(FONTS);
// للصفحة المنشورة: بنحمّل بس الخطوط اللي اتستخدمت فعلًا (أسرع للزائر)
function usedFontsHref(text) { return fontsHref(FONTS.filter((f, i) => i < 2 || text.includes(f[0]))); }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============================ إشعارات ونوافذ ============================ */
let toastTimer;
function toast(msg, kind = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = kind; }, kind === 'bad' ? 6000 : 3200);
}
function dialog({ title, html = '', buttons, onOpen }) {
  return new Promise((resolve) => {
    const d = $('#dlg');
    $('#dlg-body').innerHTML = `<h3>${esc(title)}</h3>${html}`;
    $('#dlg-actions').innerHTML = buttons.map((b) =>
      `<button class="btn ${b.cls || ''}" value="${b.value}" ${b.value === 'cancel' ? 'formnovalidate' : ''}>${esc(b.label)}</button>`).join('');
    d.onclose = () => resolve(d.returnValue || 'cancel');
    d.returnValue = '';
    d.showModal();
    if (onOpen) onOpen(d);
    const first = d.querySelector('.dlg-body input:not([type=file]):not([type=checkbox]):not([type=radio]), .dlg-body textarea'); if (first) first.focus();
  });
}

/* ============================ الدخول والجلسة ============================ */
let session = null;
function loadSession() { try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { session = null; } }
function saveSession(s) {
  session = s ? { access_token: s.access_token, refresh_token: s.refresh_token,
    expires_at: s.expires_at || Math.floor(Date.now() / 1000) + (s.expires_in || 3600),
    email: s.user ? s.user.email : (session && session.email) } : null;
  try { session ? localStorage.setItem(SESSION_KEY, JSON.stringify(session)) : localStorage.removeItem(SESSION_KEY); } catch {}
}
async function authCall(grant, body) {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error_description || data.msg || data.message || 'auth error'); e.code = data.error_code || data.error; e.status = r.status; throw e; }
  return data;
}
async function refreshIfNeeded(force = false) {
  if (!session) throw new Error('no session');
  if (!force && session.expires_at * 1000 - Date.now() > 60000) return;
  try { saveSession(await authCall('refresh_token', { refresh_token: session.refresh_token })); }
  catch (e) { logout('انتهت الجلسة. سجّل دخولك تاني.'); throw e; }
}
async function api(path, { method = 'GET', body, headers = {}, raw = false } = {}) {
  await refreshIfNeeded();
  const go = () => fetch(SB_URL + path, { method, body, headers: { apikey: SB_KEY, Authorization: `Bearer ${session.access_token}`, ...headers } });
  let r = await go();
  if (r.status === 401) { await refreshIfNeeded(true); r = await go(); }
  if (raw) return r;
  const text = await r.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!r.ok) { const e = new Error((data && (data.message || data.error)) || `HTTP ${r.status}`); e.status = r.status; e.data = data; throw e; }
  return data;
}

function friendlyDbError(e) {
  if (e.data && e.data.code === '23505') return 'فيه صفحة تانية بنفس الرابط. اختار رابط مختلف.';
  if (e.data && e.data.code === '23514') return 'الرابط لازم يكون حروف إنجليزي صغيرة وأرقام وشرطة (-) بس.';

const publicUrl = (path) => `${SB_URL}/storage/v1/object/public/${BUCKET}/${path.split('/').map(encodeURIComponent).join('/')}`;
async function listImages() {
  // الصور متقسمة في فولدرات بالتاريخ — بنجيب كل فولدر وجواه
  const top = await api(`/storage/v1/object/list/${BUCKET}`, { method: 'POST', headers: JH, body: json({ prefix: '', limit: 100, offset: 0, sortBy: { column: 'name', order: 'desc' } }) });
  const out = [];
  for (const f of top || []) {
    if (f.id) { out.push({ src: publicUrl(f.name), name: f.name }); continue; }
    const files = await api(`/storage/v1/object/list/${BUCKET}`, { method: 'POST', headers: JH, body: json({ prefix: f.name + '/', limit: 200, offset: 0, sortBy: { column: 'created_at', order: 'desc' } }) });
    (files || []).filter((x) => x.id).forEach((x) => out.push({ src: publicUrl(f.name + '/' + x.name), name: x.name }));
  }
  return out;
}
async function uploadImage(file) {
  if (!/^image\/(png|jpe?g|webp|gif|avif)$/.test(file.type)) throw new Error(`«${file.name}» مش صورة مدعومة (PNG / JPG / WebP / GIF / AVIF).`);
  if (file.size > MAX_IMAGE_MB * 1024 * 1024) throw new Error(`«${file.name}» حجمها أكبر من ${MAX_IMAGE_MB} ميجا. صغّرها الأول (مثلاً من squoosh.app).`);
  const ext = file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'img';
  const base = file.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'image';
  const path = `${new Date().toISOString().slice(0, 10)}/${base}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  await api(`/storage/v1/object/${BUCKET}/${path}`, { method: 'POST', body: file, headers: { 'Content-Type': file.type, 'x-upsert': 'false', 'cache-control': '31536000' } });
  return { src: publicUrl(path), name: path };
}
async function externalizeImages(text) {
  const re = /data:(image\/(?:png|jpe?g|webp|gif|avif));base64,([A-Za-z0-9+/=]+)/g;
  const seen = new Map();
  for (const m of text.matchAll(re)) {
    if (seen.has(m[0])) continue;
    try {
      const bin = atob(m[2]); const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const a = await uploadImage(new File([bytes], 'site-photo.' + m[1].split('/')[1].replace('jpeg', 'jpg'), { type: m[1] }));
      seen.set(m[0], a.src);
    } catch {}
  }
  seen.forEach((url, data) => { text = text.split(data).join(url); });
  return text;
}

async function loadTemplate() {
  const r = await fetch(TEMPLATE_FILE, { cache: 'no-store' });
  if (!r.ok) throw new Error(`مش لاقي ملف ${TEMPLATE_FILE} جنب لوحة التحكم.`);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  const css = [...doc.querySelectorAll('style')].map((s) => s.textContent).join('\n');
  doc.querySelectorAll('script').forEach((s) => s.remove());
  // نشيل أوامر onclick وأخواتها — الكود اللي بيشغّل الموقع بيتحط لوحده وقت النشر
  doc.body.querySelectorAll('*').forEach((el) => [...el.attributes].forEach((a) => { if (/^on/i.test(a.name)) el.removeAttribute(a.name); }));
  const parts = [...doc.body.children];
  return { css, title: doc.title, description: (doc.querySelector('meta[name=description]') || { content: '' }).content,
    sections: parts.filter((el) => !el.matches('footer')).map((el) => el.outerHTML),
    footer: (parts.find((el) => el.matches('footer')) || { outerHTML: '' }).outerHTML };
}

function itemCard(it) {
  const m = it.meta || {}, img = m.cover || PH(640, 400);

  return `<a class="b-card" href="${esc(it.slug)}.html"><img class="b-card-img" src="${esc(img)}" alt="" loading="lazy"${it.kind === 'product' ? ' style="aspect-ratio:1"' : ''}><div class="b-card-body">${line ? `<span class="b-meta">${esc(line)}</span>` : ''}<h3>${esc(it.title)}</h3>${m.excerpt ? `<p>${esc(m.excerpt)}</p>` : ''}${m.price ? `<span class="b-price">${esc(m.price)}</span>` : ''}<span class="b-more">${it.kind === 'post' ? 'اقرأ المقال' : 'التفاصيل'}</span></div></a>`;
}
function fillCollections(root, editorMode) {
  root.querySelectorAll('[data-collection]').forEach((sec) => {
    const kind = sec.getAttribute('data-collection'), limit = +sec.getAttribute('data-limit') || 12;
    const box = sec.querySelector('[data-collection-items]'); if (!box) return;
    const list = allItems.filter((i) => i.kind === kind && (editorMode || i.status === 'published'))
      .sort((a, b) => String((b.meta && b.meta.date) || b.published_at || b.updated_at).localeCompare(String((a.meta && a.meta.date) || a.published_at || a.updated_at)))
      .slice(0, limit);
    box.innerHTML = list.length ? list.map(itemCard).join('')
      : `<p class="b-empty">${editorMode ? `القايمة دي بتتملا لوحدها من «${KIND_PLURAL[kind]}» في لوحة التحكم.` : 'قريبًا.'}</p>`;
  });
}
function bodyParts(s) {
  const parts = [];
  if (s.showHeader !== false && globalData.header) parts.push({ html: globalData.header, global: 'header' });
  s.sections.forEach((h) => parts.push({ html: h }));
  if (s.showFooter !== false && globalData.footer) parts.push({ html: globalData.footer, global: 'footer' });
  return parts;
}
function renderBodyHtml(s) {
  const t = document.createElement('template');
  t.innerHTML = bodyParts(s).map((p) => p.html).join('\n');
  fillCollections(t.content, false);
  return t.innerHTML;
}
function renderDocument(page, s) {

    <div class="sel-info">المختار: <b>${name}</b>${el.hasAttribute('data-global') ? ' — بيظهر في كل الصفحات' : ''}</div>
    ${hasText ? `
    <div class="ctl"><span>نوع الخط</span><div class="chips">${[['', 'تلقائي']].concat(FONTS.map((f) => [`'${f[0]}', sans-serif`, f[1]])).map(([v, l]) => `<button type="button" data-p="fontFamily" data-v="${esc(v)}" class="${norm(s.fontFamily).replace(/"/g, "'") === norm(v) ? 'on' : ''}" style="${v ? `font-family:${esc(v)};` : ''}font-size:15px">${l}</button>`).join('')}</div></div>
    <div class="ctl"><span>حجم الخط</span>${chips('fontSize', [['', 'تلقائي'], ['14px', '14'], ['16px', '16'], ['18px', '18'], ['22px', '22'], ['28px', '28'], ['36px', '36'], ['48px', '48']], s.fontSize)}</div>
    <div class="ctl"><span>سُمك الخط</span>${chips('fontWeight', [['', 'تلقائي'], ['400', 'عادي'], ['600', 'متوسط'], ['700', 'عريض']], s.fontWeight)}</div>
    <div class="ctl"><span>لون الكلام</span>${sw('color', COLORS, s.color)}</div>
    <div class="ctl"><span>المحاذاة</span>${chips('textAlign', [['', 'تلقائي'], ['right', 'يمين'], ['center', 'وسط'], ['left', 'شمال']], s.textAlign)}</div>` : ''}
    <div class="ctl"><span>الخلفية</span>${sw('background', BGS, s.background)}<div class="chips" style="margin-top:6px"><button type="button" data-x="bgimg">صورة خلفية</button>${s.backgroundImage && s.backgroundImage !== 'none' && s.backgroundImage !== 'initial' ? '<button type="button" data-x="nobgimg">شيل صورة الخلفية</button>' : ''}</div></div>
    ${isGrid || cols ? `<div class="ctl"><span>عدد الأعمدة</span>${chips('__cols', [['1', '1'], ['2', '2'], ['3', '3'], ['4', '4']], cols)}</div>` : ''}
    <div class="ctl"><span>المسافة الداخلية</span>${chips('padding', [['', 'تلقائي'], ['0px', '0'], ['12px', 'صغيرة'], ['24px', 'متوسطة'], ['48px 24px', 'كبيرة'], ['96px 0px', 'قسم كبير']], s.padding)}</div>
    <div class="ctl"><span>المسافة تحت العنصر</span>${chips('marginBottom', [['', 'تلقائي'], ['0px', '0'], ['12px', 'صغيرة'], ['24px', 'متوسطة'], ['48px', 'كبيرة']], s.marginBottom)}</div>
    <div class="ctl"><span>استدارة الحواف</span>${chips('borderRadius', [['', 'تلقائي'], ['0px', 'حادة'], ['12px', 'خفيفة'], ['22px', 'واضحة'], ['999px', 'دايرية']], s.borderRadius)}</div>
    <div class="ctl"><span>العرض</span>${chips('__width', [['', 'تلقائي'], ['100%', 'كامل'], ['75%', '¾'], ['50%', 'نص'], ['640px', 'متوسط في النص']], s.maxWidth === '640px' ? '640px' : s.width)}</div>
    <div class="ctl"><span>الظهور</span><div class="chips"><button type="button" data-x="hm" class="${el.classList.contains('hide-mobile') ? 'on' : ''}">مخفي على الموبايل</button><button type="button" data-x="hd" class="${el.classList.contains('hide-desktop') ? 'on' : ''}">مخفي على الكمبيوتر</button></div></div>
    <button type="button" class="btn small block" data-x="reset">مسح التنسيق الإضافي</button>`;
}
$('#side-style').addEventListener('click', async (e) => {
  const el = selected; const b = e.target.closest('button'); if (!el || !b) return;
  if (b.dataset.p) {
    const p = b.dataset.p, v = b.dataset.v;
    if (p === '__cols') { el.classList.remove('b-cols-1', 'b-cols-2', 'b-cols-3', 'b-cols-4'); el.classList.add('b-grid', 'b-cols-' + v); el.style.gridTemplateColumns = ''; }
    else if (p === '__width') { if (v === '640px') { el.style.width = ''; el.style.maxWidth = '640px'; el.style.marginInline = 'auto'; } else { el.style.maxWidth = ''; el.style.marginInline = ''; el.style.width = v; } }
    else el.style[p] = v;
  } else if (b.dataset.x === 'bgimg') { const url = await pickImage('صورة خلفية'); if (!url) return; el.style.backgroundImage = `url('${url}')`; el.style.backgroundSize = 'cover'; el.style.backgroundPosition = 'center'; }
  else if (b.dataset.x === 'nobgimg') { el.style.backgroundImage = ''; el.style.backgroundSize = ''; el.style.backgroundPosition = ''; }
  else if (b.dataset.x === 'hm') el.classList.toggle('hide-mobile');
  else if (b.dataset.x === 'hd') el.classList.toggle('hide-desktop');
  else if (b.dataset.x === 'reset') el.removeAttribute('style');
  else return;
  if (el.getAttribute('style') === '') el.removeAttribute('style');
  changed(); renderStylePanel();
});
$('#side-style').addEventListener('change', (e) => {
  if (!selected || e.target.type !== 'color') return;
  selected.style[e.target.dataset.p] = e.target.value; changed(); renderStylePanel();
});

/* ---------- لوحة "الصفحة" ---------- */
function buildPagePanel() {
  const m = st.meta, k = st.kind;
  $('#side-page').innerHTML = `
    <div class="sel-info">النوع: <b>${KIND_NAMES[k] || 'صفحة'}</b> · الرابط: <span dir="ltr">${esc(current.slug === 'index' ? '/' : current.slug + '.html')}</span></div>
    <div class="field"><label for="pg-title">العنوان (بيظهر في جوجل وتاب المتصفح${k !== 'page' ? ' والكروت' : ''})</label><input id="pg-title" value="${esc(current.title)}" maxlength="80"></div>
    <div class="field"><label for="pg-desc">وصف الصفحة لجوجل</label><textarea id="pg-desc" maxlength="200">${esc(current.description)}</textarea><p class="hint">جملة أو اتنين بين 120 و160 حرف.</p></div>
    ${k !== 'page' ? `
      <h4>بيانات ال${KIND_NAMES[k]} (بتظهر في الكروت والقوايم التلقائية)</h4>
      <div class="field"><label>صورة الغلاف</label><div style="display:flex;gap:8px;align-items:center">${m.cover ? `<img src="${esc(m.cover)}" alt="" style="width:72px;height:48px;object-fit:cover;border-radius:8px">` : ''}<button class="btn small" type="button" id="pg-cover">${m.cover ? 'تغيير' : 'اختار صورة'}</button></div></div>
      <div class="field"><label for="pg-excerpt">ملخص قصير</label><textarea id="pg-excerpt" maxlength="220">${esc(m.excerpt)}</textarea></div>
      <div class="field"><label for="pg-cat">التصنيف</label><input id="pg-cat" value="${esc(m.category)}" placeholder="${k === 'post' ? 'مثلاً: هندسة' : 'مثلاً: قوالب'}"></div>
      ${k === 'post' ? `<div class="field"><label for="pg-date">تاريخ النشر</label><input id="pg-date" type="date" value="${esc(m.date)}" dir="ltr"></div>` : `<div class="field"><label for="pg-price">السعر</label><input id="pg-price" value="${esc(m.price)}" placeholder="مثلاً: 250 جنيه أو يبدأ من 1000 جنيه"></div>`}` : ''}
    <h4>أجزاء مشتركة</h4>
    <label class="choice"><input type="checkbox" id="pg-header" ${st.showHeader !== false ? 'checked' : ''}><span><b>إظهار الهيدر المشترك</b><small>القايمة اللي فوق. تعديله من أي صفحة بيظهر في الكل</small></span></label>
    <label class="choice"><input type="checkbox" id="pg-footer" ${st.showFooter !== false ? 'checked' : ''}><span><b>إظهار الفوتر المشترك</b><small>الجزء اللي تحت. تعديله من أي صفحة بيظهر في الكل</small></span></label>`;
}
$('#side-page').addEventListener('input', (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === 'pg-title') { current.title = v; $('#ed-title').textContent = v; }
  else if (id === 'pg-desc') current.description = v;
  else if (id === 'pg-excerpt') st.meta.excerpt = v;
  else if (id === 'pg-cat') st.meta.category = v;
  else if (id === 'pg-date') st.meta.date = v;
  else if (id === 'pg-price') st.meta.price = v;
  else return;
  markDirty();
});
$('#side-page').addEventListener('change', (e) => {
  if (e.target.id === 'pg-header' || e.target.id === 'pg-footer') {
    stopEditing(true); syncFromDom(); st[e.target.id === 'pg-header' ? 'showHeader' : 'showFooter'] = e.target.checked; paintBody(); pushHistory();
  }
});
$('#side-page').addEventListener('click', async (e) => {
  if (e.target.id !== 'pg-cover') return;
  const url = await pickImage('صورة الغلاف'); if (!url) return;
  st.meta.cover = url; markDirty(); buildPagePanel();
});

/* ---------- الشريط العلوي ---------- */
function setSideTab(t) {
  document.querySelectorAll('#side-tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  ['add', 'style', 'page'].forEach((x) => { $('#side-' + x).hidden = x !== t; });
  if (t === 'style') renderStylePanel();
}
$('#side-tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) setSideTab(b.dataset.tab); });
const openSide = () => document.body.classList.add('side-open');
const closeSide = () => document.body.classList.remove('side-open');
$('#side-toggle').addEventListener('click', () => document.body.classList.toggle('side-open'));
document.querySelectorAll('[data-device]').forEach((b) => b.addEventListener('click', () => {
  $('#stage').classList.toggle('mobile', b.dataset.device === 'mobile');
  document.querySelectorAll('[data-device]').forEach((x) => x.classList.toggle('on', x === b));
  setTimeout(updateOverlays, 80);
}));
$('#undo-btn').addEventListener('click', undo);
$('#redo-btn').addEventListener('click', redo);

async function savePage(auto = false) {
  if (!current || saving || !cdoc) return false;
  if (!auto) stopEditing();
  syncFromDom();
  saving = true; $('#save-btn').disabled = true; setStatus(auto ? 'حفظ تلقائي...' : 'بيحفظ...');
  try {
    const project = { v: 2, kind: st.kind, meta: st.meta, showHeader: st.showHeader, showFooter: st.showFooter, sections: st.sections };
    current = await Pages.update(current.id, { title: current.title, description: current.description, project, html: renderBodyHtml(st), css: '' });
    if (globalDirty) await saveGlobal();
    const i = pageCache.findIndex((p) => p.id === current.id);
    const info = { title: current.title, meta: st.meta, kind: st.kind, v: '2', updated_at: current.updated_at, status: current.status, slug: current.slug, id: current.id };
    if (i >= 0) pageCache[i] = { ...pageCache[i], ...info };
    allItems = pageCache.filter((p) => p.kind && p.kind !== 'page');
    dirty = false; setStatus('اتحفظ ' + new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }));
    if (!auto) toast('اتحفظ.', 'good');
    return true;
  } catch (e) { setStatus('الحفظ فشل'); toast(friendlyDbError(e), 'bad'); return false; }
  finally { saving = false; $('#save-btn').disabled = false; }
}
async function confirmLeave() {
  const r = await dialog({ title: 'فيه تعديلات مش محفوظة', html: '<p>تحب تحفظها قبل ما تخرج؟</p>',
    buttons: [{ label: 'احفظ واخرج', value: 'save', cls: 'primary' }, { label: 'اخرج من غير حفظ', value: 'discard', cls: 'danger' }, { label: 'إلغاء', value: 'cancel' }] });
  if (r === 'save') return savePage();
  return r === 'discard';
}
$('#back-btn').addEventListener('click', async () => {
  stopEditing(); if (dirty && !(await confirmLeave())) return;
  dirty = false; clearInterval(autosaveTimer); closeSide(); show('pages'); renderList();
});
$('#save-btn').addEventListener('click', () => savePage());
$('#preview-btn').addEventListener('click', () => {
  stopEditing(); syncFromDom();
  const url = URL.createObjectURL(new Blob([renderDocument(current, st)], { type: 'text/html' }));
  const w = window.open(url, '_blank'); if (!w) toast('المتصفح منع فتح تاب جديد. اسمح بالنوافذ المنبثقة للموقع ده.', 'bad');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});
$('#publish-btn').addEventListener('click', async () => {
  const r = await dialog({ title: `نشر «${current.title}»؟`, html: `<p>النسخة الحالية هتتحفظ وتتنشر على موقعك.</p>`, buttons: [{ label: 'انشر', value: 'ok', cls: 'publish' }, { label: 'إلغاء', value: 'cancel' }] });
  if (r !== 'ok' || !(await savePage(true))) return;
  const btn = $('#publish-btn'); btn.disabled = true; setStatus('بينشر...');
  try {
    const path = current.slug === 'index' ? 'index.html' : current.slug + '.html';
    const res = await api('/functions/v1/publish', { method: 'POST', headers: JH, raw: true, body: json({ id: current.id, files: [{ path, content: renderDocument(current, st) }] }) });
    if (res.status === 404) { setStatus('مسودة محفوظة'); toast('زرار النشر هيشتغل بعد ما نعمل خطوة النشر في Supabase.', 'bad'); return; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    setStatus('منشورة'); toast('اتنشرت! هتظهر على الموقع خلال دقيقة أو اتنين.', 'good');
  } catch (e) { setStatus('النشر فشل'); toast('النشر فشل: ' + e.message, 'bad'); }
  finally { btn.disabled = false; }
});
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ============================ البداية ============================ */
loadSession();
if (session) refreshIfNeeded().then(enterPages).catch(() => show('login'));
else show('login');
</script>
</body>
</html>
